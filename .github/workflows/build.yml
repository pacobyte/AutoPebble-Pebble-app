name: Build Pebble app

on:
  push:
    branches:
      - pebble-time-2
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pebble build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nodejs npm libpng-dev \
            libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g \
            xvfb xdotool
          python -m pip install --upgrade pip
          python -m pip install pebble-tool==5.0.39

      - name: Install latest Pebble SDK
        run: pebble sdk install latest

      - name: Build production PBW
        run: pebble build

      - name: Preserve production PBW
        run: cp build/*.pbw autopebble-production.pbw

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Prepare CI-only demo build
        run: |
          cp src/c/main.c src/c/main_prod.inc
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/c/main_prod.inc')
          source = path.read_text()
          source, count = re.subn(
              r'\nint main\(void\)\n\{\n\tinit\(\);\n\tapp_event_loop\(\);\n\tdeinit\(\);\n\}\s*$',
              '\n',
              source,
          )
          if count != 1:
              raise SystemExit('Could not remove original main() from CI demo source')
          path.write_text(source)
          PY
          cp ci/emulator_demo_main.c src/c/main.c
          rm -rf build
          pebble build

      - name: Launch demo in Emery emulator
        run: |
          pebble install --emulator emery
          sleep 3

      - name: Capture long Quick Screen
        run: |
          pebble screenshot --emulator emery --no-open emery-quick-long.png
          sleep 34

      - name: Capture no-title Quick Screen with explicit font override
        run: |
          pebble screenshot --emulator emery --no-open emery-quick-no-title.png
          sleep 34

      - name: Capture long List before and after navigation
        run: |
          pebble screenshot --emulator emery --no-open emery-list-long-before.png
          xdotool key x
          xdotool key x
          xdotool key x
          xdotool key x
          sleep 2
          pebble screenshot --emulator emery --no-open emery-list-long-after.png
          sleep 43

      - name: Capture long Text Screen before and after scrolling
        run: |
          pebble screenshot --emulator emery --no-open emery-text-long-before.png
          xdotool key x
          xdotool key x
          xdotool key x
          sleep 2
          pebble screenshot --emulator emery --no-open emery-text-long-after.png
          sleep 43

      - name: Capture explicit legacy override List
        run: pebble screenshot --emulator emery --no-open emery-list-custom.png

      - name: Upload production PBW artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopebble-pbw
          path: autopebble-production.pbw

      - name: Upload Emery hardening screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emery-hardening
          path: |
            emery-quick-long.png
            emery-quick-no-title.png
            emery-list-long-before.png
            emery-list-long-after.png
            emery-text-long-before.png
            emery-text-long-after.png
            emery-list-custom.png
